<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempo</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <div class="container">
        <div id="rosco"></div>
        <div id="container-centro">
            <div id="logo-container">
                <img id="logo" src="img/logo.png" alt="Logo">
                <div id="iniciarJuego" class="boton">Iniciar Juego</div>
                <div id="mostrarRes" class="boton">Mostrar Resultados</div>
            </div>
            <div id="preguntas-container">
                <p id="pregunta">Cargando pregunta...</p>
                <input type="text" id="respuesta" placeholder="Escribe tu respuesta">
                <button onclick="verificarRespuesta()">Responder</button>
                <button onclick="pasarPalabra()">Pasapalabra</button>
            </div>
            <div id="tabla-container">
                <div id="volver" class="boton">Volver</div>
            </div>
        </div>
        <div id="cont-aciertos">
            <div id="tempo">150</div>
            <div id="aciertos">0</div>
        </div>
    </div>
    </div>
</body>
<script src="js/listeners.js"></script>
<script src="js/scripts.js"></script>

</html>
